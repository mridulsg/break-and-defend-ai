# Course 2, Chapter 9 capstone (Lab 9.1): assess an MCP deployment, report, fix and retest. Run from the repository root. See README.md.
# Start the web console with:  ./shared/scripts/console-up.sh labs/c2-mcp/ch09-capstone/assessment-lab/compose.yaml
name: bdai-c2-ch09-capstone

services:
  app:
    build:
      context: ../../../../shared/toolbox/c2
    image: bdai/toolbox-c2:local
    working_dir: /lab
    command: ["bash"]
    stdin_open: true
    tty: true
    environment:
      OPENAI_BASE_URL: http://bdai-gateway:4000/v1
      OPENAI_API_KEY: ${BDAI_GATEWAY_KEY:?Run shared/scripts/setup.sh first}
      BDAI_LAB: c2-ch09-capstone
      PYTHONPATH: /lab/app:/mcp
    volumes:
      - ./app:/lab/app:ro
      - ./srv:/lab/srv:ro
      - ../../../../shared/mcp:/mcp:ro
      - capstone-lab-data:/data
    networks:
      - bdai-llm
    read_only: true
    tmpfs:
      - /tmp
      - /home/lab
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    labels:
      bdai.course: c2

  console:
    build:
      context: ../../../../shared/toolbox/c2
    image: bdai/toolbox-c2:local
    container_name: bdai-console
    working_dir: /lab
    command: ["python", "/lab/app/console.py"]
    environment:
      OPENAI_BASE_URL: http://bdai-gateway:4000/v1
      OPENAI_API_KEY: ${BDAI_GATEWAY_KEY:?Run shared/scripts/setup.sh first}
      BDAI_LAB: c2-ch09-capstone
      BDAI_CONSOLE_DIR: /console
      PYTHONPATH: /lab/app:/mcp
    volumes:
      - ./app:/lab/app:ro
      - ./srv:/lab/srv:ro
      - ../../../../shared/console:/console:ro
      - ../../../../shared/mcp:/mcp:ro
      - capstone-lab-data:/data
    networks:
      - bdai-llm
    read_only: true
    tmpfs:
      - /tmp
      - /home/lab
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      bdai.course: c2

networks:
  bdai-llm:
    name: bdai-llm
    external: true

volumes:
  capstone-lab-data:
    name: bdai-c2-ch09-capstone-data
    labels:
      bdai.course: c2
