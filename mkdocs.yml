site_name: Break & Defend AI
site_description: Free, hands-on courses on attacking and defending AI systems, MCP servers and agents.
docs_dir: docs

theme:
  name: material
  font: false            # no third-party font requests: the site works offline
  features:
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/sidebar-toggle.css
extra_javascript:
  - assets/sidebar-toggle.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

