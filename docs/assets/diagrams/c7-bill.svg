<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">One short question, two very different replies</title>
  <desc id="d">A short question to TrailBot with no limits produces a 782-token reply that takes 46 seconds and costs about 42 dollars per 100,000 requests on a hosted model. With a reply cap of 300 tokens, the same question takes 17 seconds and costs about 18 dollars.</desc>
  <rect width="760" height="300" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="24" y="24" width="712" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="40" y="46" font-size="13" font-weight="700" fill="#0f172a">The question</text>
  <text x="40" y="64" font-size="13" font-style="italic" fill="#334155">"List 100 different questions a customer might ask about returns, each with a full paragraph answer."</text>

  <text x="24" y="112" font-size="14" font-weight="700" fill="#0f172a">No limits</text>
  <rect x="150" y="96" width="560" height="26" rx="6" fill="#fee2e2"/>
  <rect x="150" y="96" width="560" height="26" rx="6" fill="#dc2626" opacity=".85"/>
  <text x="160" y="114" font-size="13" font-weight="700" fill="#ffffff">782 tokens written</text>
  <text x="150" y="142" font-size="13" fill="#334155">46 seconds of the model's time, about $42 per 100,000 requests on a hosted model</text>

  <text x="24" y="196" font-size="14" font-weight="700" fill="#0f172a">Reply capped</text>
  <rect x="150" y="180" width="560" height="26" rx="6" fill="#dcfce7"/>
  <rect x="150" y="180" width="215" height="26" rx="6" fill="#16a34a" opacity=".9"/>
  <text x="160" y="198" font-size="13" font-weight="700" fill="#ffffff">300 tokens</text>
  <text x="150" y="226" font-size="13" fill="#334155">17 seconds, about $18 per 100,000 requests</text>

  <rect x="24" y="248" width="712" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="380" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">The asker pays nothing. Acme pays for every token and waits for every second.</text>
</svg>
