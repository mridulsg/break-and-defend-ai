<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">A threat model of TrailBot: parts, trust boundaries and where each attack enters</title>
  <desc id="d">A customer and outside content sit outside Acme's trust boundary. Inside are the TrailBot app, the model, the knowledge base and the order tools. Numbered markers show where the attacks from chapters 3 to 9 enter: prompt injection at the customer and knowledge base, excessive agency at the tools, poisoning at the knowledge base, cost at the model, and the supply chain at the model file and packages.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <rect x="14" y="14" width="150" height="272" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="30" y="36" font-weight="700" font-size="13" fill="#475569">OUTSIDE ACME</text>
    <rect x="28" y="52" width="122" height="46" rx="8" fill="#ffffff" stroke="#64748b"/><text x="89" y="80" text-anchor="middle">Customer</text>
    <rect x="28" y="116" width="122" height="46" rx="8" fill="#ffffff" stroke="#64748b"/><text x="89" y="138" text-anchor="middle">Partner web page</text><text x="89" y="154" text-anchor="middle" font-size="11" fill="#64748b">and customer notes</text>
    <rect x="28" y="180" width="122" height="46" rx="8" fill="#ffffff" stroke="#64748b"/><text x="89" y="202" text-anchor="middle">Model hub and</text><text x="89" y="218" text-anchor="middle">package index</text>
    <rect x="28" y="238" width="122" height="36" rx="8" fill="#ffffff" stroke="#64748b"/><text x="89" y="261" text-anchor="middle">Uploaded images</text>

    <rect x="184" y="14" width="562" height="272" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="36" font-weight="700" font-size="13" fill="#15803d">INSIDE ACME'S TRUST BOUNDARY</text>
    <rect x="212" y="110" width="130" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="277" y="138" text-anchor="middle" font-weight="700">TrailBot app</text><text x="277" y="156" text-anchor="middle" font-size="11" fill="#64748b">builds the prompt</text>
    <rect x="400" y="56" width="130" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="465" y="86" text-anchor="middle" font-weight="700">Model</text>
    <rect x="400" y="126" width="130" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="465" y="148" text-anchor="middle" font-weight="700">Knowledge base</text><text x="465" y="164" text-anchor="middle" font-size="11" fill="#64748b">handbook, notes, web</text>
    <rect x="400" y="196" width="130" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="465" y="218" text-anchor="middle" font-weight="700">Order tools</text><text x="465" y="234" text-anchor="middle" font-size="11" fill="#64748b">lookup, refund</text>
    <rect x="582" y="110" width="150" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="657" y="138" text-anchor="middle" font-weight="700">Staff and bill</text><text x="657" y="156" text-anchor="middle" font-size="11" fill="#64748b">people act on replies</text>

    <line x1="150" y1="75" x2="210" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="150" y1="139" x2="210" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="342" y1="126" x2="398" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="342" y1="142" x2="398" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="342" y1="158" x2="398" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="530" y1="86" x2="580" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="150" y1="203" x2="214" y2="168" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <line x1="150" y1="256" x2="240" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <g font-size="12" font-weight="700" fill="#fff">
      <circle cx="180" cy="92" r="11" fill="#dc2626"/><text x="180" y="96" text-anchor="middle">1</text>
      <circle cx="180" cy="140" r="11" fill="#dc2626"/><text x="180" y="144" text-anchor="middle">2</text>
      <circle cx="370" cy="190" r="11" fill="#dc2626"/><text x="370" y="194" text-anchor="middle">3</text>
      <circle cx="372" cy="104" r="11" fill="#dc2626"/><text x="372" y="108" text-anchor="middle">4</text>
      <circle cx="560" cy="108" r="11" fill="#dc2626"/><text x="560" y="112" text-anchor="middle">5</text>
      <circle cx="192" cy="226" r="11" fill="#dc2626"/><text x="192" y="230" text-anchor="middle">6</text>
      <circle cx="182" cy="188" r="11" fill="#dc2626"/><text x="182" y="192" text-anchor="middle">7</text>
    </g>
  </g>
  <g font-size="12" fill="#334155">
    <text x="20" y="312"><tspan font-weight="700" fill="#b91c1c">1</tspan> a customer's message (Ch 3)   <tspan font-weight="700" fill="#b91c1c">2</tspan> a planted note or page, and false facts (Ch 3, 5)   <tspan font-weight="700" fill="#b91c1c">3</tspan> the model is told to use a tool (Ch 4)</text>
    <text x="20" y="332"><tspan font-weight="700" fill="#b91c1c">4</tspan> a long request, a made-up answer (Ch 7)   <tspan font-weight="700" fill="#b91c1c">5</tspan> unsafe output used by a person or a page (Ch 4, 7)</text>
    <text x="20" y="352"><tspan font-weight="700" fill="#b91c1c">6</tspan> a hidden instruction in an image (Ch 6)   <tspan font-weight="700" fill="#b91c1c">7</tspan> a model file or a package that runs code (Ch 9)</text>
  </g>
</svg>
