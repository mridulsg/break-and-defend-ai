<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Two ways a confident answer can hurt</title>
  <desc id="d">TrailBot invents a price-matching policy with a made-up number and a customer relies on it. The dev assistant invents a package name, an attacker registers that name with malware, and an engineer installs it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="340" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-size="13" fill="#0f172a">
    <rect x="14" y="14" width="360" height="250" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="34" cy="34" r="13" fill="#d97706"/><text x="34" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="56" y="39" font-weight="700" font-size="15">An invented policy</text>
    <rect x="28" y="56" width="332" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="40" y="76" font-size="12" font-style="italic">Customer: "Do you offer price matching?"</text>
    <text x="40" y="92" font-size="12" font-style="italic" fill="#64748b">(the handbook has no such policy)</text>
    <line x1="194" y1="102" x2="194" y2="122" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="28" y="126" width="332" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="40" y="146" font-size="12" font-style="italic">TrailBot: "Yes, we match prices within 14 days,</text>
    <text x="40" y="162" font-size="12" font-style="italic">at 110% of the lower price."</text>
    <line x1="194" y1="172" x2="194" y2="192" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="28" y="196" width="332" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="40" y="216" font-weight="700" fill="#b91c1c">The customer relies on it.</text>
    <text x="40" y="236" font-size="12" fill="#334155">A tribunal made an airline honour a refund</text>
    <text x="40" y="250" font-size="12" fill="#334155">policy its chatbot invented.</text>

    <rect x="386" y="14" width="360" height="250" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="406" cy="34" r="13" fill="#7c3aed"/><text x="406" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="428" y="39" font-weight="700" font-size="15">An invented package</text>
    <rect x="400" y="56" width="332" height="44" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="412" y="76" font-size="12" font-style="italic">Engineer: "A package for the TrailPass API?"</text>
    <text x="412" y="92" font-size="12" font-style="italic" fill="#64748b">(no such package exists)</text>
    <line x1="566" y1="102" x2="566" y2="122" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="400" y="126" width="332" height="44" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="412" y="146" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">pip install acme-trailpass</text>
    <text x="412" y="162" font-size="12" fill="#64748b">The attacker registered that name, with malware.</text>
    <line x1="566" y1="172" x2="566" y2="192" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="400" y="196" width="332" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="412" y="216" font-weight="700" fill="#b91c1c">The engineer installs it.</text>
    <text x="412" y="236" font-size="12" fill="#334155">Attackers register names that AI tools keep</text>
    <text x="412" y="250" font-size="12" fill="#334155">inventing, and wait.</text>
  </g>

  <rect x="14" y="280" width="732" height="46" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="380" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">The model sounds equally sure when it is guessing.</text>
  <text x="380" y="319" text-anchor="middle" font-size="13" fill="#334155">Check the claim against a source before anyone acts on it.</text>
</svg>
