<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">What works: keep the attacker's ingredients away from the model</title>
  <desc id="d">Only the staff handbook reaches TrailBot. Customer notes, partner web pages and the secret code are kept out. TrailBot then answers from the handbook only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="20" y="24" width="250" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="36" y="48" font-size="15" font-weight="700" fill="#0f172a">Staff handbook</text>
  <text x="36" y="66" font-size="13" fill="#334155">written and reviewed by staff</text>
  <line x1="272" y1="50" x2="412" y2="140" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="20" y="96" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="36" y="120" font-size="15" font-weight="700" fill="#0f172a">Customer notes</text>
  <text x="36" y="138" font-size="13" fill="#334155">anyone can write these</text>

  <rect x="20" y="168" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="36" y="192" font-size="15" font-weight="700" fill="#0f172a">Partner web pages</text>
  <text x="36" y="210" font-size="13" fill="#334155">written by a third party</text>

  <rect x="20" y="240" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="36" y="264" font-size="15" font-weight="700" fill="#0f172a">The secret code</text>
  <text x="36" y="282" font-size="13" fill="#334155">no reason for the model to hold it</text>

  <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
    <line x1="272" y1="122" x2="318" y2="122" stroke-dasharray="5 5"/>
    <line x1="272" y1="194" x2="318" y2="194" stroke-dasharray="5 5"/>
    <line x1="272" y1="266" x2="318" y2="266" stroke-dasharray="5 5"/>
    <line x1="332" y1="100" x2="332" y2="290" stroke-width="6"/>
  </g>
  <text x="344" y="192" font-size="13" font-weight="700" fill="#b91c1c" transform="rotate(90 344 192)" text-anchor="middle" letter-spacing="1">KEPT OUT</text>

  <rect x="420" y="100" width="150" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">TrailBot</text>
  <text x="495" y="172" text-anchor="middle" font-size="13" fill="#334155">sees only the</text>
  <text x="495" y="190" text-anchor="middle" font-size="13" fill="#334155">trusted handbook</text>

  <line x1="572" y1="155" x2="622" y2="155" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="626" y="110" width="122" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="687" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Normal</text>
  <text x="687" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">answers</text>
  <text x="687" y="186" text-anchor="middle" font-size="12" fill="#334155">nothing to hijack</text>

  <text x="440" y="262" font-size="14" fill="#0f172a">The attack needed the note or the secret.</text>
  <text x="440" y="284" font-size="14" fill="#0f172a">We removed them, so the model never had</text>
  <text x="440" y="306" font-size="14" fill="#0f172a">to "resist" anything.</text>
</svg>
