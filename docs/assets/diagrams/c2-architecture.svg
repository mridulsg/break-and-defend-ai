<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">MCP: a host with a model, a client for each server, and the servers that own the tools</title>
  <desc id="d">An engineer talks to the host, an AI application containing the model and one MCP client per server. Each client sends tools/list and tools/call over HTTP to a server. Notes and tickets are Acme's own servers; a third server comes from someone else. Numbered markers show where attacks enter: tool descriptions, tool results, the arguments the model writes, who may call what, the server you installed, and the network door.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <rect x="14" y="60" width="110" height="60" rx="8" fill="#ffffff" stroke="#64748b"/><text x="69" y="86" text-anchor="middle" font-weight="700">Engineer</text><text x="69" y="104" text-anchor="middle" font-size="11" fill="#64748b">asks questions</text>

    <rect x="150" y="14" width="260" height="250" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="166" y="36" font-weight="700" fill="#15803d">HOST (the AI application)</text>
    <rect x="166" y="48" width="228" height="50" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="280" y="70" text-anchor="middle" font-weight="700">Model</text><text x="280" y="86" text-anchor="middle" font-size="11" fill="#64748b">reads descriptions, picks tools</text>
    <rect x="166" y="112" width="228" height="36" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="280" y="135" text-anchor="middle">MCP client: notes</text>
    <rect x="166" y="154" width="228" height="36" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="280" y="177" text-anchor="middle">MCP client: tickets</text>
    <rect x="166" y="196" width="228" height="36" rx="8" fill="#ffffff" stroke="#16a34a"/><text x="280" y="219" text-anchor="middle">MCP client: third party</text>
    <text x="280" y="252" text-anchor="middle" font-size="11" fill="#64748b">one client per server, one POST per message</text>

    <rect x="470" y="60" width="270" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="485" y="82" font-weight="700">Server: notes (Acme)</text><text x="485" y="98" font-size="11" fill="#64748b">list_notes, read_note</text>
    <rect x="470" y="118" width="270" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="485" y="140" font-weight="700">Server: tickets (Acme)</text><text x="485" y="156" font-size="11" fill="#64748b">list_tickets, get_ticket, add_comment (writes)</text>
    <rect x="470" y="176" width="270" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="485" y="198" font-weight="700">Server: third party (not Acme's)</text><text x="485" y="214" font-size="11" fill="#64748b">someone else wrote its code and its descriptions</text>

    <line x1="124" y1="90" x2="148" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="394" y1="130" x2="468" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="394" y1="172" x2="468" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="394" y1="214" x2="468" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="520" y="40" font-size="11" fill="#64748b">tools/list and tools/call, as JSON over HTTP</text>

    <g font-size="12" font-weight="700" fill="#fff">
      <circle cx="430" cy="100" r="11" fill="#dc2626"/><text x="430" y="104" text-anchor="middle">1</text>
      <circle cx="450" cy="164" r="11" fill="#dc2626"/><text x="450" y="168" text-anchor="middle">2</text>
      <circle cx="418" cy="86" r="11" fill="#7c3aed"/><text x="418" y="90" text-anchor="middle">3</text>
      <circle cx="740" cy="30" r="11" fill="#7c3aed"/><text x="740" y="34" text-anchor="middle">4</text>
      <circle cx="744" cy="206" r="11" fill="#dc2626"/><text x="744" y="210" text-anchor="middle">5</text>
      <circle cx="456" cy="214" r="11" fill="#7c3aed"/><text x="456" y="218" text-anchor="middle">6</text>
    </g>
  </g>
  <g font-size="12" fill="#334155">
    <text x="20" y="292"><tspan font-weight="700" fill="#b91c1c">1</tspan> a tool's description is read by the model as instructions (Ch 2)   <tspan font-weight="700" fill="#b91c1c">2</tspan> a tool's result is read as text (Ch 2, 3)</text>
    <text x="20" y="312"><tspan font-weight="700" fill="#6d28d9">3</tspan> the arguments the model writes reach the server's code (Ch 3)   <tspan font-weight="700" fill="#6d28d9">4</tspan> who may call what, and as whom (Ch 4)</text>
    <text x="20" y="332"><tspan font-weight="700" fill="#b91c1c">5</tspan> a server you installed that is not yours (Ch 7, 8)   <tspan font-weight="700" fill="#6d28d9">6</tspan> the network door: Origin, localhost, tokens (this chapter, Ch 4)</text>
  </g>
</svg>
