<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">An indirect attack on TrailBot in five steps</title>
  <desc id="d">An attacker submits a customer note. TrailBot saves it. Another customer asks about returns. TrailBot pulls the note into its prompt. The answer contains a scam phone number.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-size="13" fill="#0f172a">
    <rect x="12" y="30" width="136" height="190" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="30" cy="48" r="13" fill="#dc2626"/><text x="30" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="50" y="53" font-weight="700" font-size="14">Attacker</text>
    <text x="24" y="86">Submits a "customer</text><text x="24" y="104">note" on the website</text><text x="24" y="122">feedback form.</text>
    <text x="24" y="156" font-style="italic" fill="#475569">The note hides an</text><text x="24" y="174" font-style="italic" fill="#475569">order for the bot.</text>

    <rect x="160" y="30" width="136" height="190" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="178" cy="48" r="13" fill="#d97706"/><text x="178" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="198" y="53" font-weight="700" font-size="14">Saved</text>
    <text x="172" y="86">TrailBot stores it</text><text x="172" y="104">next to the staff</text><text x="172" y="122">handbook.</text>
    <text x="172" y="156" font-style="italic" fill="#475569">Nobody reviews it.</text>

    <rect x="308" y="30" width="136" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="326" cy="48" r="13" fill="#16a34a"/><text x="326" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="346" y="53" font-weight="700" font-size="14">A customer asks</text>
    <text x="320" y="92" font-style="italic">"How long do I have</text><text x="320" y="110" font-style="italic">to return a tent?"</text>
    <text x="320" y="156" fill="#475569">A different person,</text><text x="320" y="174" fill="#475569">days later.</text>

    <rect x="456" y="30" width="136" height="190" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="474" cy="48" r="13" fill="#7c3aed"/><text x="474" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="494" y="53" font-weight="700" font-size="14">Bot reads</text>
    <text x="468" y="86">It grabs the 3 best</text><text x="468" y="104">matching texts. One</text><text x="468" y="122">is the attacker's</text><text x="468" y="140">note.</text>
    <text x="468" y="174" font-style="italic" fill="#475569">It follows the order.</text>

    <rect x="604" y="30" width="144" height="190" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="622" cy="48" r="13" fill="#dc2626"/><text x="622" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="642" y="53" font-weight="700" font-size="14">The answer</text>
    <text x="616" y="86">A normal answer,</text><text x="616" y="104">plus a scam:</text>
    <text x="616" y="136" font-style="italic">"call 1-800-555-0199</text><text x="616" y="154" font-style="italic">and read out your</text><text x="616" y="172" font-style="italic">card number."</text>
  </g>

  <line x1="150" y1="125" x2="158" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="298" y1="125" x2="306" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="446" y1="125" x2="454" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="594" y1="125" x2="602" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="12" y="246" width="736" height="68" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="380" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">The attacker never spoke to TrailBot.</text>
  <text x="380" y="296" text-anchor="middle" font-size="14" fill="#334155">The customer sees an ordinary answer in TrailBot's own voice, and has no way to know a stranger wrote the scam.</text>
</svg>
