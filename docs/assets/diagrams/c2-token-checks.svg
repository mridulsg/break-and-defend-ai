<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Four checks on a token</title>
  <desc id="d">A token passes four checks in order: signature, expiry, audience, scope. Skipping signature lets anyone write a token. Skipping expiry lets stolen tokens work forever. Skipping audience lets a token for one server work on another. Skipping scope lets a read-only token write.</desc>
  <rect width="760" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <rect x="14" y="14" width="173" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="100" y="38" text-anchor="middle" font-weight="700">1 Signature</text><text x="100" y="60" text-anchor="middle" font-size="12">Did our issuer</text><text x="100" y="76" text-anchor="middle" font-size="12">really make it?</text>
    <text x="100" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Skipped:</text><text x="100" y="130" text-anchor="middle" font-size="12" fill="#334155">anyone writes a token</text>
    <rect x="197" y="14" width="173" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="283" y="38" text-anchor="middle" font-weight="700">2 Expiry</text><text x="283" y="60" text-anchor="middle" font-size="12">Is it still</text><text x="283" y="76" text-anchor="middle" font-size="12">valid?</text>
    <text x="283" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Skipped:</text><text x="283" y="130" text-anchor="middle" font-size="12" fill="#334155">stolen tokens live on</text>
    <rect x="380" y="14" width="173" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="466" y="38" text-anchor="middle" font-weight="700">3 Audience</text><text x="466" y="60" text-anchor="middle" font-size="12">Is it for</text><text x="466" y="76" text-anchor="middle" font-size="12">THIS server?</text>
    <text x="466" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Skipped:</text><text x="466" y="130" text-anchor="middle" font-size="12" fill="#334155">one token opens all</text>
    <rect x="563" y="14" width="183" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="654" y="38" text-anchor="middle" font-weight="700">4 Scope</text><text x="654" y="60" text-anchor="middle" font-size="12">Does it allow</text><text x="654" y="76" text-anchor="middle" font-size="12">THIS tool?</text>
    <text x="654" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Skipped:</text><text x="654" y="130" text-anchor="middle" font-size="12" fill="#334155">read-only can write</text>
  </g>
  <rect x="14" y="182" width="732" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="380" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">No token or a bad one: 401. A good token without enough scope: 403.</text>
  <text x="380" y="224" text-anchor="middle" font-size="13" fill="#334155">The server decides how to check. It never lets the token choose.</text>
</svg>
