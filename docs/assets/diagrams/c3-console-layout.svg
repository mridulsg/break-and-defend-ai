<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">The Acme support console</title>
  <desc id="d">A browser window with a left menu (customer chat, feedback and content, missions), a chat in the middle, and a Behind the scenes panel on the right that shows exactly what TrailBot read, with the handbook, customer notes and the secret code colour coded. A top bar holds the model picker and mission progress.</desc>
  <rect width="760" height="446" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- window -->
  <rect x="14" y="14" width="732" height="288" rx="10" fill="#f4f6f8" stroke="#94a3b8"/>
  <rect x="14" y="14" width="732" height="38" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="15" y="40" width="730" height="12" fill="#ffffff"/>
  <rect x="26" y="24" width="18" height="18" rx="4" fill="#1b6b4a"/>
  <path d="M29 38 34 29 37 34 39 31 42 38z" fill="#fff"/>
  <text x="52" y="38" font-size="12" font-weight="700" fill="#0f172a">Acme Outdoor Gear</text>
  <rect x="470" y="24" width="150" height="20" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="480" y="38" font-size="11" fill="#334155">Model: Local (free)  ▾</text>
  <rect x="630" y="24" width="98" height="20" rx="10" fill="#dff3e8" stroke="#1a7f4b"/>
  <text x="679" y="38" font-size="11" font-weight="700" text-anchor="middle" fill="#145239">Missions 0/2</text>

  <!-- left menu -->
  <rect x="14" y="52" width="130" height="250" fill="#10261f"/>
  <rect x="22" y="62" width="114" height="26" rx="6" fill="#1d3d33"/>
  <text x="32" y="79" font-size="11" fill="#ffffff">Customer chat</text>
  <text x="32" y="106" font-size="11" fill="#c9d8d1">Feedback and content</text>
  <text x="32" y="130" font-size="11" fill="#c9d8d1">Missions</text>

  <!-- chat -->
  <rect x="270" y="66" width="164" height="26" rx="10" fill="#1b6b4a"/>
  <text x="352" y="83" font-size="11" text-anchor="middle" fill="#fff">How long to return a tent?</text>
  <rect x="156" y="102" width="214" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="166" y="120" font-size="11" fill="#0f172a">You have 30 days to return a tent</text>
  <text x="166" y="135" font-size="11" fill="#0f172a">for a full refund.</text>
  <rect x="166" y="141" width="62" height="11" rx="5" fill="#dff3e8"/><text x="197" y="150" font-size="9" font-weight="700" text-anchor="middle" fill="#1a7f4b">Handbook</text>
  <text x="236" y="150" font-size="9" fill="#2457b8" font-weight="700">Inspect</text>
  <rect x="156" y="268" width="226" height="26" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="166" y="285" font-size="11" fill="#94a3b8">Message TrailBot</text>
  <rect x="388" y="268" width="46" height="26" rx="7" fill="#1b6b4a"/>
  <text x="411" y="285" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Send</text>

  <!-- inspector -->
  <rect x="442" y="52" width="304" height="250" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="454" y="72" font-size="12" font-weight="700" fill="#0f172a">Behind the scenes</text>
  <text x="454" y="92" font-size="10.5" font-weight="700" fill="#145239">What TrailBot saw</text>
  <line x1="452" y1="97" x2="545" y2="97" stroke="#1b6b4a" stroke-width="2"/>
  <text x="560" y="92" font-size="10.5" fill="#5a6776">Sources used</text>
  <text x="640" y="92" font-size="10.5" fill="#5a6776">Monitor</text>
  <line x1="442" y1="98" x2="746" y2="98" stroke="#dfe4ea"/>
  <rect x="454" y="108" width="280" height="62" rx="6" fill="#f8fafb" stroke="#dfe4ea"/>
  <text x="462" y="123" font-size="9" font-weight="700" fill="#5a6776">SYSTEM: TRAILBOT'S RULES</text>
  <text x="462" y="139" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">Answer using only the context.</text>
  <text x="462" y="155" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">Internal escalation code:</text>
  <rect x="580" y="145" width="62" height="14" rx="3" fill="#fde6e3" stroke="#b42318"/>
  <text x="611" y="155" font-size="10" font-weight="700" text-anchor="middle" fill="#b42318" font-family="ui-monospace, Menlo, Consolas, monospace">ESC-••••••</text>
  <rect x="454" y="178" width="280" height="116" rx="6" fill="#f8fafb" stroke="#dfe4ea"/>
  <text x="462" y="193" font-size="9" font-weight="700" fill="#5a6776">USER TURN: CONTEXT AND QUESTION</text>
  <rect x="462" y="200" width="262" height="30" rx="4" fill="#dff3e8" stroke="#1a7f4b"/>
  <text x="468" y="213" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">[returns-policy.md]</text>
  <text x="468" y="225" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">Returns within 30 days of delivery…</text>
  <rect x="462" y="236" width="262" height="30" rx="4" fill="#fdf0d5" stroke="#b26a00"/>
  <text x="468" y="249" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">[note-002.md]</text>
  <text x="468" y="261" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">Delivery was quick, thanks!</text>
  <text x="468" y="283" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">Question: How long to return a tent?</text>

  <!-- number badges -->
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="150" cy="196" r="11" fill="#dc2626"/><text x="150" y="200">1</text>
    <circle cx="300" cy="190" r="11" fill="#dc2626"/><text x="300" y="194">2</text>
    <circle cx="738" cy="64" r="11" fill="#dc2626"/><text x="738" y="68">3</text>
    <circle cx="456" cy="32" r="11" fill="#dc2626"/><text x="456" y="36">4</text>
  </g>

  <!-- captions -->
  <g font-size="13" fill="#0f172a">
    <circle cx="30" cy="326" r="10" fill="#dc2626"/><text x="30" y="330" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="48" y="331"><tspan font-weight="700">Menu.</tspan> The chat, the feedback form where you plant notes, and your missions.</text>
    <circle cx="30" cy="352" r="10" fill="#dc2626"/><text x="30" y="356" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="48" y="357"><tspan font-weight="700">Chat.</tspan> You are a customer. Every question stands alone; TrailBot remembers nothing.</text>
    <circle cx="30" cy="378" r="10" fill="#dc2626"/><text x="30" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="48" y="383"><tspan font-weight="700">Behind the scenes.</tspan> The exact text the model read. Green is handbook, amber is customer notes,</text>
    <text x="48" y="399">purple is a partner page, red is the secret (hidden from you, so you still have to extract it).</text>
    <circle cx="30" cy="424" r="10" fill="#dc2626"/><text x="30" y="428" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="48" y="429"><tspan font-weight="700">Top bar.</tspan> Pick the free local model or a paid hosted one, and watch your mission progress.</text>
  </g>
</svg>
