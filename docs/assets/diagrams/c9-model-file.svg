<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">A model file is a small program for the loader</title>
  <desc id="d">Two pickle model files look the same from outside. The clean one tells the loader to build a dictionary of numbers. The community one first tells the loader to import an operating-system function and call it, then builds the same dictionary, so the model still works and nothing looks wrong.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-size="13" fill="#0f172a">
    <rect x="14" y="14" width="360" height="236" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="30" y="40" font-weight="700" font-size="15">sentiment-v1.pkl (Acme's own)</text>
    <rect x="28" y="56" width="332" height="78" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="40" y="78" font-size="12" fill="#64748b">What the loader is told, step by step:</text>
    <text x="40" y="100" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">1. build a dictionary of numbers</text>
    <text x="40" y="120" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">2. hand it back</text>
    <line x1="194" y1="136" x2="194" y2="158" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="28" y="162" width="332" height="72" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="40" y="186" font-weight="700" fill="#15803d">Loads. Imports nothing.</text>
    <text x="40" y="206" font-size="12" fill="#334155">Nothing in it can run a function,</text>
    <text x="40" y="222" font-size="12" fill="#334155">so loading it is safe.</text>

    <rect x="386" y="14" width="360" height="236" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="402" y="40" font-weight="700" font-size="15">sentiment-community.pkl (a hub upload)</text>
    <rect x="400" y="56" width="332" height="78" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="412" y="78" font-size="12" fill="#64748b">What the loader is told, step by step:</text>
    <text x="412" y="96" font-size="12" font-weight="700" fill="#b91c1c" font-family="ui-monospace, Menlo, Consolas, monospace">1. import posix.mkdir and call it</text>
    <text x="412" y="114" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">2. build a dictionary of numbers</text>
    <text x="412" y="130" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">3. hand it back</text>
    <line x1="566" y1="136" x2="566" y2="158" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="400" y="162" width="332" height="72" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="412" y="186" font-weight="700" fill="#b91c1c">Loads, and the model works.</text>
    <text x="412" y="206" font-size="12" fill="#334155">Step 1 already ran. A real attack puts</text>
    <text x="412" y="222" font-size="12" fill="#334155">a reverse shell there instead of a folder.</text>
  </g>

  <rect x="14" y="266" width="732" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="380" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Nothing looks wrong after loading, so look before you load.</text>
  <text x="380" y="306" text-anchor="middle" font-size="13" fill="#334155">A scanner reads the steps without running them. A plain-data format has no steps at all.</text>
</svg>
