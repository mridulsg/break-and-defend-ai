<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">An agent: a goal, a loop, tools, memory, and where each attack enters</title>
  <desc id="d">A user gives a goal. The agent loop plans a step, calls a tool, reads the result, and repeats. It has memory that persists between runs, an identity with permissions, and may talk to other agents. Numbered markers show where attacks enter: text the agent reads, the memory, the tools and permissions, and other agents.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="760" height="300" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <rect x="14" y="100" width="110" height="60" rx="8" fill="#ffffff" stroke="#64748b"/><text x="69" y="126" text-anchor="middle" font-weight="700">User</text><text x="69" y="144" text-anchor="middle" font-size="11" fill="#64748b">gives a goal</text>
    <rect x="150" y="20" width="360" height="190" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="166" y="42" font-weight="700" fill="#15803d">THE AGENT LOOP</text>
    <rect x="170" y="56" width="150" height="40" rx="8" fill="#fff" stroke="#16a34a"/><text x="245" y="81" text-anchor="middle">1 Plan the next step</text>
    <rect x="340" y="56" width="150" height="40" rx="8" fill="#fff" stroke="#16a34a"/><text x="415" y="81" text-anchor="middle">2 Call a tool</text>
    <rect x="340" y="116" width="150" height="40" rx="8" fill="#fff" stroke="#16a34a"/><text x="415" y="141" text-anchor="middle">3 Read the result</text>
    <rect x="170" y="116" width="150" height="40" rx="8" fill="#fff" stroke="#16a34a"/><text x="245" y="141" text-anchor="middle">4 Done? Or repeat</text>
    <line x1="320" y1="76" x2="338" y2="76" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="415" y1="96" x2="415" y2="114" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="340" y1="136" x2="322" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="245" y1="116" x2="245" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="330" y="190" text-anchor="middle" font-size="11" fill="#64748b">the model decides each step from the goal, memory and everything read so far</text>
    <line x1="124" y1="130" x2="148" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="540" y="20" width="200" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="640" y="42" text-anchor="middle" font-weight="700">Tools and data</text><text x="640" y="58" text-anchor="middle" font-size="11" fill="#64748b">web, tickets, email, files</text>
    <rect x="540" y="84" width="200" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="640" y="106" text-anchor="middle" font-weight="700">Memory</text><text x="640" y="122" text-anchor="middle" font-size="11" fill="#64748b">survives between runs</text>
    <rect x="540" y="148" width="200" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="640" y="170" text-anchor="middle" font-weight="700">Identity + permissions</text><text x="640" y="186" text-anchor="middle" font-size="11" fill="#64748b">what it may do, as whom</text>
    <rect x="540" y="212" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="640" y="237" text-anchor="middle" font-weight="700">Other agents</text>
    <line x1="510" y1="45" x2="538" y2="45" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="510" y1="109" x2="538" y2="109" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <g font-size="12" font-weight="700" fill="#fff">
      <circle cx="525" cy="38" r="11" fill="#dc2626"/><text x="525" y="42" text-anchor="middle">1</text>
      <circle cx="525" cy="102" r="11" fill="#dc2626"/><text x="525" y="106" text-anchor="middle">2</text>
      <circle cx="525" cy="166" r="11" fill="#7c3aed"/><text x="525" y="170" text-anchor="middle">3</text>
      <circle cx="525" cy="230" r="11" fill="#7c3aed"/><text x="525" y="234" text-anchor="middle">4</text>
    </g>
  </g>
  <g font-size="12" fill="#334155">
    <text x="20" y="272"><tspan font-weight="700" fill="#b91c1c">1</tspan> text it reads can steer it (Ch 2)   <tspan font-weight="700" fill="#b91c1c">2</tspan> what it remembers can be planted (Ch 3)   <tspan font-weight="700" fill="#6d28d9">3</tspan> its permissions set the damage (Ch 4)   <tspan font-weight="700" fill="#6d28d9">4</tspan> agents trust each other (Ch 5)</text>
  </g>
</svg>
