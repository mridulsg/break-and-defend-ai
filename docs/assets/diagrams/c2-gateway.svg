<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">A gateway between the host and its MCP servers</title>
  <desc id="d">The host sends every list and call to a gateway. The gateway applies an allowlist, definition pinning, a description scan, approval for writes, a secret filter and a rate limit, then passes allowed traffic to Acme's servers or a third-party server.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="760" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <rect x="14" y="70" width="120" height="70" rx="8" fill="#ffffff" stroke="#64748b"/><text x="74" y="100" text-anchor="middle" font-weight="700">Host</text><text x="74" y="118" text-anchor="middle" font-size="11" fill="#64748b">model + clients</text>
    <rect x="170" y="14" width="400" height="190" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="370" y="36" text-anchor="middle" font-weight="700" fill="#15803d">GATEWAY: every list and call</text>
    <g font-size="12">
      <rect x="186" y="50" width="176" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="274" y="70" text-anchor="middle">1 Server allowlist</text>
      <rect x="378" y="50" width="176" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="466" y="70" text-anchor="middle">2 Pinned definitions</text>
      <rect x="186" y="92" width="176" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="274" y="112" text-anchor="middle">3 Description scan</text>
      <rect x="378" y="92" width="176" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="466" y="112" text-anchor="middle">4 Approval for writes</text>
      <rect x="186" y="134" width="176" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="274" y="154" text-anchor="middle">5 Secret filter</text>
      <rect x="378" y="134" width="176" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="466" y="154" text-anchor="middle">6 Rate limit</text>
      <text x="370" y="190" text-anchor="middle" fill="#64748b">logs everything it allows and everything it refuses</text>
    </g>
    <rect x="606" y="30" width="140" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="676" y="57" text-anchor="middle">Acme notes</text>
    <rect x="606" y="86" width="140" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="676" y="113" text-anchor="middle">Acme tickets</text>
    <rect x="606" y="142" width="140" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="676" y="169" text-anchor="middle">third party</text>
    <line x1="134" y1="105" x2="168" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="570" y1="70" x2="604" y2="54" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="570" y1="105" x2="604" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="570" y1="140" x2="604" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  </g>
  <rect x="14" y="214" width="732" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="380" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">One place to enforce policy. Servers still defend themselves.</text>
</svg>
